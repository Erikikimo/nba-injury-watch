name: Injury watch

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub runs this "best effort"; expect 5–15 min between runs
  workflow_dispatch: {}      # "Run workflow" button for a manual check
  push:
    branches: [main]
    paths: ["docs/index.html", "config/**", "scraper/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: injury-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.poll.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check for new injury reports
        id: poll
        run: python scraper/injury_watch.py

      - name: Commit new data
        if: steps.poll.outputs.changed == 'true'
        run: |
          git config user.name  "injury-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && exit 0
          git commit -m "Injury report $(jq -r .report.label docs/data/latest.json)"
          git pull --rebase --autostash
          git push

  deploy:
    needs: check
    # Redeploy when there's new data, or when the dashboard/config itself changed.
    if: needs.check.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
