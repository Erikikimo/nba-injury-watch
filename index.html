<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBA Injury Watch</title>
<style>
  :root {
    --bg: #0d1014; --panel: #151a20; --panel2: #1b2129; --line: #262e38;
    --text: #e8edf2; --muted: #8a96a3; --faint: #5d6874;
    --out: #ef4b4b; --doubtful: #f2853a; --questionable: #f2c23a; --probable: #9ccc4a; --available: #3fbf7f;
    --accent: #5aa9ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         font-variant-numeric: tabular-nums; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  header { position: sticky; top: 0; z-index: 5; background: rgba(13,16,20,.92); backdrop-filter: blur(8px);
           border-bottom: 1px solid var(--line); }
  .bar { max-width: 1280px; margin: 0 auto; padding: 12px 20px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 17px; margin: 0; letter-spacing: .2px; font-weight: 700; }
  h1 span { color: var(--out); }
  .meta { color: var(--muted); font-size: 13px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--available); display: inline-block; box-shadow: 0 0 0 3px rgba(63,191,127,.15); }
  .dot.stale { background: var(--questionable); box-shadow: 0 0 0 3px rgba(242,194,58,.15); }
  .grow { flex: 1; }
  input[type=search] { background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 8px;
                       padding: 7px 10px; width: 220px; font: inherit; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { background: var(--panel); color: var(--muted); border: 0; padding: 7px 11px; font: inherit; cursor: pointer; }
  .seg button.on { background: var(--panel2); color: var(--text); }
  main { max-width: 1280px; margin: 0 auto; padding: 20px; display: grid; gap: 20px;
         grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } input[type=search] { width: 100%; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
  section > h2 { margin: 0; padding: 12px 16px; font-size: 13px; text-transform: uppercase; letter-spacing: .8px;
                 color: var(--muted); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  section > h2 small { text-transform: none; letter-spacing: 0; color: var(--faint); font-weight: 400; }
  .full { grid-column: 1 / -1; }
  .scroll { max-height: 640px; overflow: auto; }
  .group-h { position: sticky; top: 0; background: var(--panel2); padding: 6px 16px; font-size: 12px; color: var(--muted);
             border-bottom: 1px solid var(--line); z-index: 1; }
  .chg { display: grid; grid-template-columns: 4px 1fr auto; gap: 12px; padding: 10px 16px 10px 0; border-bottom: 1px solid var(--line); }
  .chg .edge { border-radius: 0 3px 3px 0; }
  .edge.downgrade { background: var(--out); } .edge.upgrade { background: var(--available); } .edge.none { background: var(--line); }
  .who { font-weight: 600; } .who .rk { margin-left: 6px; }
  .sub { color: var(--muted); font-size: 12.5px; }
  .why { color: var(--faint); font-size: 12.5px; margin-top: 2px; }
  .kind { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
  .move { display: flex; align-items: center; gap: 6px; white-space: nowrap; align-self: center; }
  .arrow { color: var(--faint); }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid; }
  .s-Out { color: var(--out); border-color: rgba(239,75,75,.45); background: rgba(239,75,75,.1); }
  .s-Doubtful { color: var(--doubtful); border-color: rgba(242,133,58,.45); background: rgba(242,133,58,.1); }
  .s-Questionable { color: var(--questionable); border-color: rgba(242,194,58,.45); background: rgba(242,194,58,.1); }
  .s-Probable { color: var(--probable); border-color: rgba(156,204,74,.45); background: rgba(156,204,74,.1); }
  .s-Available { color: var(--available); border-color: rgba(63,191,127,.45); background: rgba(63,191,127,.1); }
  .s-off { color: var(--muted); border-color: var(--line); background: transparent; }
  .rk { display: inline-block; font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; font-weight: 500; }
  .rk.w { color: var(--accent); border-color: rgba(90,169,255,.4); }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  td:first-child { padding-left: 16px; width: 52px; color: var(--muted); }
  td.st { white-space: nowrap; text-align: right; padding-right: 16px; }
  .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; padding: 16px; }
  .game { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .game-h { display: flex; justify-content: space-between; padding: 9px 12px; border-bottom: 1px solid var(--line); font-weight: 600; }
  .game-h span:last-child { color: var(--muted); font-weight: 400; font-size: 12.5px; }
  .team { padding: 8px 12px; }
  .team + .team { border-top: 1px dashed var(--line); }
  .team-n { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 4px; display: flex; gap: 8px; align-items: center; }
  .row { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; }
  .row.minor { color: var(--muted); font-size: 12.5px; }
  .row .pill { font-size: 11px; padding: 1px 7px; }
  .more { background: none; border: 0; color: var(--accent); font: inherit; font-size: 12px; cursor: pointer; padding: 4px 0 0; }
  .nys { font-size: 11px; color: var(--questionable); border: 1px solid rgba(242,194,58,.4); border-radius: 5px; padding: 0 5px; text-transform: none; letter-spacing: 0; }
  .empty { padding: 28px 16px; color: var(--muted); text-align: center; }
  .datehdr { grid-column: 1 / -1; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .8px; margin-top: 4px; }
  footer { max-width: 1280px; margin: 0 auto; padding: 0 20px 30px; color: var(--faint); font-size: 12px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>NBA <span>Injury</span> Watch</h1>
    <div class="meta" id="meta">Loading…</div>
    <div class="grow"></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <input type="search" id="q" placeholder="Filter player or team…">
      <div class="seg" id="scope">
        <button data-v="notable" class="on">Top players</button>
        <button data-v="all">Everyone</button>
      </div>
    </div>
  </div>
</header>

<main>
  <section>
    <h2>Key changes <small id="chg-count"></small></h2>
    <div class="scroll" id="changes"></div>
  </section>
  <section>
    <h2>Tracked players on the report <small id="trk-count"></small></h2>
    <div class="scroll"><table id="tracked"></table></div>
  </section>
  <section class="full">
    <h2>Games <small id="games-count"></small></h2>
    <div class="games" id="games"></div>
  </section>
</main>
<footer>
  Source: official NBA injury report PDFs (published every 15 min). "Top players" = top 200 of the Basketball Monster
  rankings + your watchlist (edit <code>config/players.json</code>). Times are Eastern.
</footer>

<script>
const ORDER = { Out: 4, Doubtful: 3, Questionable: 2, Probable: 1, Available: 0 };
const TYPE_LABEL = { status: "Status change", added: "Added to report", initial: "First listed",
                     removed: "Dropped off report", team_submitted: "Team submitted" };
const state = { latest: null, changes: [], scope: "notable", q: "" };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pill = (s) => s ? `<span class="pill s-${esc(s)}">${esc(s)}</span>` : `<span class="pill s-off">off report</span>`;
const rank = (p) => p.watch && !p.rank ? `<span class="rk w">watch</span>` : p.rank ? `<span class="rk${p.watch ? " w" : ""}">#${p.rank}</span>` : "";
const match = (o) => !state.q || [o.name, o.team, o.matchup].some((v) => (v || "").toLowerCase().includes(state.q));

async function load() {
  try {
    if (window.__DEMO__) { Object.assign(state, window.__DEMO__); }
    else {
      const bust = "?t=" + Date.now();
      const [l, c] = await Promise.all([fetch("data/latest.json" + bust), fetch("data/changes.json" + bust)]);
      state.latest = l.ok ? await l.json() : null;
      state.changes = c.ok ? await c.json() : [];
    }
  } catch (e) { console.error(e); }
  render();
}

function ago(iso) {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return "just now"; if (m < 60) return `${m} min ago`;
  const h = Math.floor(m / 60); return h < 24 ? `${h}h ${m % 60}m ago` : `${Math.floor(h / 24)}d ago`;
}

function renderMeta() {
  const L = state.latest;
  if (!L) { $("meta").innerHTML = "No report processed yet — the first run of the GitHub Action will fill this in."; return; }
  const r = L.report, stale = r.slot && (Date.now() - new Date(r.slot)) > 45 * 60000;
  const nys = L.teams.filter((t) => !t.submitted).length;
  $("meta").innerHTML = `<span class="dot${stale ? " stale" : ""}"></span>
    <span>Report <b>${esc(r.label)}</b> ET${r.slot ? ` · ${ago(r.slot)}` : ""}</span>
    <a href="${esc(r.url)}" target="_blank" rel="noopener">PDF ↗</a>
    <span>· ${L.players.length} players listed${nys ? ` · ${nys} teams not yet submitted` : ""}</span>`;
}

function renderChanges() {
  let list = state.changes.filter((c) => c.type !== "team_submitted" || state.scope === "all");
  if (state.scope === "notable") list = list.filter((c) => c.notable);
  list = list.filter(match);
  $("chg-count").textContent = list.length ? `${list.length} shown` : "";
  if (!list.length) {
    $("changes").innerHTML = `<div class="empty">${state.changes.length ? (state.scope === "notable" && !state.q
      ? `No top-player changes in the last ${new Set(state.changes.map((c) => c.report)).size} report(s) with changes.<br>Switch to <b>Everyone</b> to see all ${state.changes.length}.`
      : "No matching changes.") :
      "No changes yet. Changes appear once two consecutive reports have been compared."}</div>`;
    return;
  }
  let html = "", last = null;
  for (const c of list.slice(0, 300)) {
    if (c.report !== last) { html += `<div class="group-h">Report ${esc(c.report)} ET</div>`; last = c.report; }
    if (c.type === "team_submitted") {
      html += `<div class="chg"><div class="edge none"></div><div><div class="kind">${TYPE_LABEL[c.type]}</div>
        <div class="who">${esc(c.team)}</div><div class="sub">${esc(c.matchup)} · ${esc(c.game_time)} ET</div></div><div></div></div>`;
      continue;
    }
    const dir = c.direction || "none";
    const move = c.type === "status" || c.type === "removed"
      ? `${pill(c.from)}<span class="arrow">→</span>${pill(c.to)}` : pill(c.to);
    html += `<div class="chg"><div class="edge ${dir}"></div>
      <div><div class="kind">${TYPE_LABEL[c.type] || c.type}</div>
        <div class="who">${esc(c.name)}${rank(c)}</div>
        <div class="sub">${esc(c.team)} · ${esc(c.matchup)} · ${esc(c.game_date?.slice(0, 5))} ${esc(c.game_time)} ET</div>
        ${c.reason && c.type !== "removed" ? `<div class="why">${esc(c.reason)}</div>` : ""}</div>
      <div class="move">${move}</div></div>`;
  }
  $("changes").innerHTML = html;
}

function renderTracked() {
  const L = state.latest; if (!L) { $("tracked").innerHTML = ""; return; }
  const ps = L.players.filter((p) => p.notable && match(p))
    .sort((a, b) => (a.rank || 999) - (b.rank || 999));
  $("trk-count").textContent = ps.length ? `${ps.length} listed` : "";
  $("tracked").innerHTML = ps.length ? ps.map((p) => `<tr>
      <td>${rank(p)}</td>
      <td><div class="who">${esc(p.name)}</div><div class="sub">${esc(p.team)} · ${esc(p.matchup)} ${esc(p.game_time)} ET</div>
          <div class="why">${esc(p.reason)}</div></td>
      <td class="st">${pill(p.status)}</td></tr>`).join("")
    : `<tr><td colspan="3" class="empty">No tracked players on the current report.</td></tr>`;
}

function renderGames() {
  const L = state.latest; if (!L) { $("games").innerHTML = ""; return; }
  const games = new Map();
  for (const t of L.teams) {
    const k = `${t.game_date}|${t.matchup}`;
    if (!games.has(k)) games.set(k, { date: t.game_date, time: t.game_time, matchup: t.matchup, teams: new Map() });
    games.get(k).teams.set(t.team, { ...t, players: [] });
  }
  for (const p of L.players) {
    const g = games.get(`${p.game_date}|${p.matchup}`); if (!g) continue;
    if (!g.teams.has(p.team)) g.teams.set(p.team, { team: p.team, submitted: true, players: [] });
    g.teams.get(p.team).players.push(p);
  }
  let html = "", lastDate = null, n = 0;
  for (const g of games.values()) {
    const teams = [...g.teams.values()];
    if (state.q && !teams.some((t) => match({ team: t.team, matchup: g.matchup }) || t.players.some(match))) continue;
    if (g.date !== lastDate) { html += `<div class="datehdr">${esc(g.date)}</div>`; lastDate = g.date; }
    n++;
    html += `<div class="game"><div class="game-h"><span>${esc(g.matchup)}</span><span>${esc(g.time)} ET</span></div>`;
    for (const t of teams) {
      const ps = t.players.sort((a, b) => (b.notable - a.notable) || (ORDER[b.status] - ORDER[a.status]) || (a.rank || 999) - (b.rank || 999));
      const major = ps.filter((p) => p.notable), minor = ps.filter((p) => !p.notable);
      const id = "m" + Math.random().toString(36).slice(2);
      html += `<div class="team"><div class="team-n">${esc(t.team)}${t.submitted ? "" : ` <span class="nys">not yet submitted</span>`}</div>`;
      html += major.map((p) => `<div class="row"><span><b>${esc(p.name)}</b> ${rank(p)}</span>${pill(p.status)}</div>`).join("");
      if (minor.length) {
        const show = state.scope === "all";
        html += `<div id="${id}" style="display:${show ? "block" : "none"}">` +
          minor.map((p) => `<div class="row minor"><span>${esc(p.name)}</span>${pill(p.status)}</div>`).join("") + `</div>`;
        if (!show) html += `<button class="more" onclick="this.previousElementSibling.style.display='block';this.remove()">+ ${minor.length} other${minor.length > 1 ? "s" : ""}</button>`;
      }
      if (t.submitted && !ps.length) html += `<div class="row minor">No injuries listed</div>`;
      html += `</div>`;
    }
    html += `</div>`;
  }
  $("games-count").textContent = n ? `${n} games` : "";
  $("games").innerHTML = html || `<div class="empty">No games on the current report.</div>`;
}

function render() { renderMeta(); renderChanges(); renderTracked(); renderGames(); }

$("q").addEventListener("input", (e) => { state.q = e.target.value.trim().toLowerCase(); render(); });
$("scope").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  state.scope = b.dataset.v;
  [...$("scope").children].forEach((x) => x.classList.toggle("on", x === b));
  render();
});
load();
if (!window.__DEMO__) setInterval(load, 60000);
</script>
</body>
</html>
